<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in – Flexpower EMS Kit</title>
<style>
:root { color-scheme: light; --bg: #f3f4f2; --surface-1: #fcfcfb; --border: #d6d5d0; --text-primary: #0b0b0b;
  --text-secondary: #52514e; --accent: #2a78d6; --critical-text: #b42727; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { color-scheme: dark; --bg: #111110;
  --surface-1: #1a1a19; --border: #3a3a36; --text-primary: #f0efec; --text-secondary: #c3c2b7; --accent: #3987e5; --critical-text: #e66767; } }
:root[data-theme="dark"] { color-scheme: dark; --bg: #111110; --surface-1: #1a1a19; --border: #3a3a36;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --accent: #3987e5; --critical-text: #e66767; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg);
  color: var(--text-primary); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
form { width: 100%; max-width: 360px; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 28px 24px; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
.logo { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px;
  background: linear-gradient(135deg, #2a78d6, #6250d6); color: #fff; }
.logo svg { width: 24px; height: 24px; fill: currentColor; }
form { box-shadow: 0 12px 40px rgba(20,20,15,.08); }
p.sub { margin: 0 0 22px; color: var(--text-secondary); font-size: 13px; }
label { display: block; font-size: 13px; color: var(--text-secondary); margin: 14px 0 6px; }
input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text-primary); }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { width: 100%; margin-top: 22px; padding: 11px; font: inherit; font-weight: 600; border: 0; border-radius: 8px;
  background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
#error { color: var(--critical-text); font-size: 13px; margin: 14px 0 0; min-height: 1.2em; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></div>
  <h1>Flexpower EMS Kit</h1>
  <p class="sub">Sign in to view the energy dashboard.</p>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Sign in</button>
  <p id="error" role="alert"></p>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const b = document.getElementById("b"), err = document.getElementById("error");
  b.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("u").value, password: document.getElementById("p").value }) });
    if (r.ok) { location.replace("/"); return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = typeof j.detail === "string" ? j.detail : "Sign-in failed.";
    document.getElementById("p").value = "";
    document.getElementById("p").focus();
  } catch (_) { err.textContent = "Cannot reach the server."; }
  b.disabled = false;
});
</script>
</body>
</html>
